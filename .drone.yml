kind: pipeline
type: exec
name: amd64 — clang
trigger:
  branch:
  - main

steps:
- name: code coverage
  environment:
    CODECOV_TOKEN:
      from_secret: CODECOV_TOKEN 
  commands:
    - ./tools/ci//coverage.sh

