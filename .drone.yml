---
kind: pipeline
type: exec
name: amd64 — msvc
trigger:
  branch:
  - main
platform:
  os: windows
  arch: amd64

steps:
- name: unit tests
  shell: powershell
  commands: 
    - ./tools/ci/steps/amd64/msvc/unit-tests.ps1

---
kind: pipeline
type: docker
name: amd64 — gcc
trigger:
  branch:
  - main

steps:
- name: unit tests
  image: unit_tests:latest
  pull: if-not-exists
  commands:
    - ./tools/ci/steps/amd64/gcc/unit-tests.sh

- name: valgrind
  image: valgrind:latest
  pull: if-not-exists
  commands:
    - ./tools/ci/steps/amd64/gcc/valgrind.sh

---
kind: pipeline
type: docker
name: amd64 — clang
trigger:
  branch:
  - main

steps:
- name: leak sanitizer
  image: leak_sanitizer:latest
  pull: if-not-exists
  commands:
    - ./tools/ci/steps/amd64/clang/lsan.sh

---
kind: pipeline
type: docker
name: static analysis
trigger:
  branch:
  - main

steps:
- name: static_analysis
  image: static_analysis:latest
  pull: if-not-exists
  privileged: true
  commands:
    - ./tools/ci/steps/static_analysis.sh

---
kind: pipeline
type: docker
name: style
trigger:
  branch:
  - main

steps:
- name: clang format
  image: clang_format:latest
  pull: if-not-exists
  commands:
    - ./tools/ci/steps/style.sh
